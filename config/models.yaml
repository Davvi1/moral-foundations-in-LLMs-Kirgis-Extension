# after confirmatory data exists (it would invalidate the run manifests).
#
# Chosen for FAMILY DIVERSITY first. The design simulation treats models as
# exchangeable draws; sizes within one family are not independent, so effective
# N is below nominal N when a family dominates. Qwen and Llama keep a size
# gradient because Kirgis's capability claim needs within-family scale variation.
#
